# Unraid memory watchdog: per-server settings
# Keep this file at /boot/config/custom/unraid-memory-watchdog.conf.
# Preserve it when updating the scripts. Restart the watchdog after editing it.
#
# Format: NAME=value, one setting per line. Blank lines and # comments are allowed.
# Simple single/double quotes around a value are optional. Do not use shell commands,
# variables or escape sequences: this file is data and is never executed.
# Omitted settings use the defaults built into the script. Unknown keys or invalid
# values prevent startup so a typo cannot silently change the protection.

# Poll every 30 seconds. Critical evidence starts on the first critical observation.
INTERVAL=30

# Available RAM as a percentage of this host's total RAM.
# Warning must persist for WARN_SECONDS; critical capture does not wait.
WARN_PCT=15
WARN_SECONDS=60
CRIT_PCT=5

# Optional recovery waits for sustained critical pressure before considering Docker.
CRIT_SECONDS=60

# Require extra headroom for two minutes before a new incident can be armed.
RECOVER_PCT=20
RECOVER_SECONDS=120

# Optional kernel memory-stall signal. If absent, MemAvailable still works.
USE_PSI=0
PSI_SOME=20
PSI_FULL=10

# Send native Unraid Alerts using the host's configured notification destinations.
NOTIFY=1

# Default: evidence and Alerts only. Set to 1 to allow Docker-only recovery.
# No setting enables host-process killing, VM shutdown or host reboot.
RESTART_CONTAINER=0

# Empty target means the largest eligible running container. Otherwise give one
# exact container name. Exclusions are exact names separated by spaces.
TARGET_CONTAINER=""
EXCLUDE_CONTAINERS=""

# Minimum application memory required for a restart candidate: 2 GiB in KiB.
# This is an absolute threshold, so review it for smaller/larger servers.
CONTAINER_MIN_KIB=2097152

# Flash write protection: cooldowns in seconds, shared daily cap, stored report cap.
# Safety checks require cooldowns >=3600, DAILY_MAX <=4, and DAILY_MAX <=KEEP <=12.
WARN_COOLDOWN=21600
CRIT_COOLDOWN=3600
DAILY_MAX=4
KEEP=12

# Maximum output per diagnostic section: 64 KiB. The script refuses larger values.
SECTION_BYTES=65536
